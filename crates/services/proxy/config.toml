[[server]]
enable = false
name = ["abc.zennozenith.com"]

[server.listen.http]
port = [8080]

[server.proxy]
alg = "RoundRobin"
type = "LoadBalancer"

[[server.proxy.backend]]
scheme.type = "http"
address = "127.0.0.1:3060"
weight = 5

[[server.proxy.backend]]
scheme.type = "https"
scheme.sni = "abc.zennozenith.com"
address = "127.0.0.1:3061"
weight = 10

[[server]]
enable = true
name = ["pqr.zennozenith.com"]

[server.listen.http]
port = [8080]

[server.listen.https]
port = [8443]
http2 = true
ssl_certificate = "tests/keys/pqr.zennozenith.com/server.crt"
ssl_certificate_key = "tests/keys/pqr.zennozenith.com/key.pem"

[server.proxy]
type = "Proxy"
scheme.type = "http"
address = "127.0.0.1:3060"
