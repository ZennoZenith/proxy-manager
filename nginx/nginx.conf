# pid /run/nginx/nginx.pid;
error_log stderr;
daemon off;

events {
}

http {
    # Load mime types and configure maximum size of the types hash tables.
    include ./mime.types;
    types_hash_max_size 2688;
    include ./conf/fastcgi.conf;
    include ./conf/uwsgi_params;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

    # $connection_upgrade is used for websocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    client_max_body_size 10m;
    server_tokens off;

    server {
        listen 0.0.0.0:80 ;
        server_name *.zennozenith.com ;

        location / {
            proxy_pass http://127.0.0.1:6188;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            client_max_body_size 50000M;
            proxy_read_timeout   600s;
            proxy_send_timeout   600s;
            send_timeout         600s;

            include ./nginx-recommended-proxy_set_header-headers.conf;
        }
    }

    server {
        listen 0.0.0.0:80 default_server ;
        listen [::0]:80 default_server ;
        server_name localhost ;
        location / {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            client_max_body_size 50000M;
            proxy_read_timeout   600s;
            proxy_send_timeout   600s;
            send_timeout         600s;
            
            include ./nginx-recommended-proxy_set_header-headers.conf;
        }
    }
}

stream {
    map $ssl_preread_server_name $upstream {
        ~^(.+)\.zennozenith\.com$ 127.0.0.1:6189;
        default                    127.0.0.1:6189;
    }

    server {
        listen 443;
        proxy_pass $upstream;
        ssl_preread on;

        ## Add this line:
        # proxy_protocol on;
        # Optional: increase timeouts for long-lived connections (like websockets)
         
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

