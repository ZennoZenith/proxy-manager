[[server]]
enable = true
name = ["xyz.zennozenith.com"]
type = "redirect"
http_code = 307
preserve_path = true
# scheme.protocol = "http"
location = "https://pqr.zennozenith.com"

[server.listen.http]
port = [6188]


[[server]]
enable = true
name = ["pqr.zennozenith.com"]
type = "proxy"
mode = "direct"
address = "127.0.0.1:4004"

[server.scheme]
protocol = "https"
sni = "pqr.zennozenith.com" ## optional

[server.listen.http]
port = [6188]

[server.listen.https]
port = [6189]
http2 = true
ssl_certificate = "examples/keys/pqr.zennozenith.com/server.crt"
ssl_certificate_key = "examples/keys/pqr.zennozenith.com/key.pem"

[[server]]
enable = true
name = ["abc.zennozenith.com", "aaa.zennozenith.com"]
type = "proxy"
mode = "loadbalanced"
alg = "RoundRobin"

[server.listen.http]
port = [6188]

[[server.backend]]
scheme.protocol = "https"
scheme.sni = "example.com"
address = "127.0.0.1:4004"
weight = 2

[[server.backend]]
scheme.protocol = "http"
address = "127.0.0.1:4000"

[[server.backend]]
scheme.protocol = "http"
address = "127.0.0.1:4001"

[[server.backend]]
scheme.protocol = "http"
address = "127.0.0.1:4002"
weight = 1
