<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proxy Gateway — Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080c10; --surface: #0d1520; --border: #1a2840;
      --accent: #00e5ff; --accent2: #7c3aed;
      --text: #c8d8f0; --muted: #4a6080; --ok: #00e5a0;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; overflow: hidden; position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; opacity: 0.18; }
    .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; right: -100px; animation: drift 12s ease-in-out infinite alternate; }
    .orb-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; left: -80px; animation: drift 15s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px, 40px); } }

    .container { position: relative; z-index: 10; text-align: center; max-width: 680px; padding: 2rem; animation: fadeUp 0.8s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

    .status-bar {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,229,160,0.08); border: 1px solid rgba(0,229,160,0.2);
      border-radius: 100px; padding: 6px 16px;
      font-size: 0.7rem; color: var(--ok); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2.5rem;
    }
    .dot { width: 7px; height: 7px; background: var(--ok); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.8); } }

    .logo { width: 72px; height: 72px; background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(124,58,237,0.15)); border: 1px solid var(--border); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem; box-shadow: 0 0 40px rgba(0,229,255,0.1); }
    h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; background: linear-gradient(135deg, #fff 30%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; }
    .subtitle { font-size: 0.85rem; color: var(--muted); line-height: 1.7; margin-bottom: 2.5rem; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 2rem; text-align: left; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: rgba(0,229,255,0.3); transform: translateY(-2px); }
    .card-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 4px; }
    .card-value { font-size: 0.88rem; color: var(--accent); font-weight: 500; }

    hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .footer { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; }
    .tag { display: inline-block; background: rgba(0,229,255,0.07); border: 1px solid rgba(0,229,255,0.15); border-radius: 6px; padding: 2px 8px; font-size: 0.62rem; color: var(--accent); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="container">
    <div class="status-bar"><div class="dot"></div>Proxy operational</div>
    <div class="logo">⇄</div>
    <h1>Gateway<br>Online</h1>
    <p class="subtitle">Reverse proxy is active and routing traffic.<br>Configure upstream targets to start forwarding requests.</p>
    <div class="cards">
      <div class="card"><div class="card-label">Status</div><div class="card-value">200 OK</div></div>
      <div class="card"><div class="card-label">Mode</div><div class="card-value">Reverse Proxy</div></div>
      <div class="card"><div class="card-label">Session Uptime</div><div class="card-value" id="uptime">Calculating…</div></div>
      <div class="card"><div class="card-label">Server Time (UTC)</div><div class="card-value" id="clock">—</div></div>
    </div>
    <hr>
    <div class="footer">No upstream configured for this route &nbsp;·&nbsp; <span class="tag">Default Page</span></div>
  </div>
  <script>
    const start = Date.now();
    const pad = n => String(n).padStart(2,'0');
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;
      const s = Math.floor((Date.now()-start)/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
      document.getElementById('uptime').textContent = h ? `${h}h ${pad(m)}m ${pad(sec)}s` : m ? `${pad(m)}m ${pad(sec)}s` : `${sec}s`;
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
